name: RAPTOR Data Fetch

on:
  schedule:
    # Ogni ora dalle 8 alle 18, lunedì-venerdì (UTC = ora italiana - 1 o -2)
    - cron: '0 7-17 * * 1-5'
  workflow_dispatch:  # permette avvio manuale dal sito GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # permesso per fare push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dipendenze
        run: pip install yfinance

      - name: Esegui RAPTOR Fetch
        run: python raptor_fetch.py

      - name: Commit e push raptor_data.json
        run: |
          git config user.name  "RAPTOR Bot"
          git config user.email "raptor-bot@noreply.github.com"
          git add raptor_data.json
          git diff --staged --quiet || git commit -m "📊 RAPTOR data $(date +'%d/%m/%Y %H:%M')"
          git push
