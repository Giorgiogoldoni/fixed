<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏆 RAPTOR Ranking Live</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand h1{font-size:16px;font-weight:700;color:#0f172a;letter-spacing:.5px}
.nav-brand .tag{font-size:9px;background:#0ea5e9;color:#fff;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.5px}
.nav-right{display:flex;align-items:center;gap:8px}
.btn-nav{display:flex;align-items:center;gap:5px;background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-family:'Sora',sans-serif;font-weight:600;transition:all .15s;text-decoration:none}
.btn-nav:hover{background:#e2e8f0;color:#0f172a}
#lastCalc{font-size:10px;color:#94a3b8;font-family:'JetBrains Mono',monospace}
.btn-excel-rank{background:#16a34a;border:none;color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;transition:filter .15s;font-family:'Sora',sans-serif;}
.btn-excel-rank:hover{filter:brightness(1.1)}
.summary{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid #e2e8f0}
.sum-badge{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:all .15s;font-family:'Sora',sans-serif;background:none}
.sum-badge:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sb-long{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
.sb-early{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}
.sb-watch{background:#fffbeb;color:#92400e;border-color:#fde68a}
.sb-rosso{background:#f8fafc;color:#475569;border-color:#cbd5e1}
.sb-all{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.sb-stop{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.sb-uscita{background:#fff7ed;color:#9a3412;border-color:#fdba74}
.sb-att{background:#fffbeb;color:#92400e;border-color:#fde68a}
.sum-badge .cnt{font-size:16px;font-weight:700}
.sum-badge.act{box-shadow:0 0 0 2px currentColor}
.filters-wrap{padding:10px 20px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters-label{font-size:10px;color:#94a3b8;font-weight:600;letter-spacing:.5px;margin-right:4px}
.chip{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;padding:4px 10px;border-radius:20px;cursor:pointer;font-size:10px;font-weight:600;transition:all .15s;font-family:'Sora',sans-serif}
.chip:hover{border-color:#0ea5e9;color:#0284c7}
.chip.act{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
.chip-reset{background:transparent;border:1px dashed #cbd5e1;color:#94a3b8}
.chip-reset:hover{border-color:#f87171;color:#ef4444}
.search-bar{padding:8px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px}
#searchInput{flex:1;max-width:300px;border:1px solid #e2e8f0;border-radius:6px;padding:7px 12px;font-size:12px;font-family:'Sora',sans-serif;background:#fff;color:#0f172a;outline:none}
#searchInput:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.1)}
#resultCount{font-size:11px;color:#94a3b8;font-family:'JetBrains Mono',monospace}
.table-wrap{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 260px)}
table{width:100%;border-collapse:collapse;min-width:1100px}
thead th{background:#f8fafc;border-bottom:2px solid #e2e8f0;padding:9px 10px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;position:sticky;top:0;z-index:10;user-select:none}
thead th:hover{color:#0f172a;background:#f1f5f9}
thead th.sort-asc::after{content:' ↑';color:#0ea5e9}
thead th.sort-desc::after{content:' ↓';color:#0ea5e9}
tbody tr{border-bottom:1px solid #f1f5f9;transition:background .1s}
tbody tr:hover{background:#f0f9ff;cursor:pointer}
td{padding:7px 10px;font-size:11px;color:#0f172a;white-space:nowrap}
td.mono{font-family:'JetBrains Mono',monospace;font-size:11px}
.rank-n{color:#94a3b8;font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;padding-right:12px}
.tk-cell{font-weight:700;color:#0ea5e9;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.3px}
.cat-cell{font-size:10px;color:#64748b;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ok{color:#059669;font-weight:700;font-size:13px}
.no{color:#dc2626;font-weight:700;font-size:13px}
.stato-verde{color:#059669;font-weight:700;font-size:10px;background:#ecfdf5;padding:2px 7px;border-radius:4px}
.stato-grigio{color:#475569;font-weight:700;font-size:10px;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.stato-rosso{color:#dc2626;font-weight:700;font-size:10px;background:#fef2f2;padding:2px 7px;border-radius:4px}
.tipo-long{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.tipo-early{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.tipo-watch{background:#fffbeb;color:#92400e;border:1px solid #fde68a;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.tipo-rosso{background:#f8fafc;color:#475569;border:1px solid #cbd5e1;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.tipo-none{color:#cbd5e1;font-size:10px}
.score-cell{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px}
.score-hi{color:#059669}.score-mid{color:#d97706}.score-lo{color:#94a3b8}
.perf-pos{color:#059669}.perf-neg{color:#dc2626}
.er-hi{color:#059669;font-weight:700}.er-lo{color:#dc2626}
.score-bar-cell{display:flex;align-items:center;gap:5px}
.score-mini-bar{height:4px;background:#e2e8f0;border-radius:2px;width:50px;display:inline-block;vertical-align:middle}
.score-mini-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#0ea5e9,#6366f1)}
.err-row td{color:#cbd5e1;font-style:italic}
.loading{text-align:center;padding:80px 20px;color:#94a3b8}
.loading .icon{font-size:40px;margin-bottom:12px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <span style="font-size:20px">🦅</span>
    <div>
      <h1>RAPTOR RANKING LIVE</h1>
      <div style="font-size:9px;color:#94a3b8;font-family:JetBrains Mono,monospace;margin-top:2px">v3.0 &nbsp;·&nbsp; JSON Edition</div>
    </div>
    <span class="tag" id="tickerCount">...</span>
  </div>
  <div class="nav-right">
    <span id="lastCalc"></span>
    <a href="RAPTOR_Advanced.html" class="btn-nav" id="btnToDash">📈 Dashboard</a>
    <button class="btn-excel-rank" onclick="exportExcel()">⬇ Excel</button>
  </div>
</nav>

<div class="summary">
  <button class="sum-badge sb-all act" id="sf_ALL"    onclick="setTipoFilter('ALL')"><span>Tutti</span><span class="cnt" id="cnt_ALL">0</span></button>
  <button class="sum-badge sb-long"   id="sf_LONG"   onclick="setTipoFilter('LONG')"><span>🟢 LONG</span><span class="cnt" id="cnt_LONG">0</span></button>
  <button class="sum-badge sb-early"  id="sf_EARLY"  onclick="setTipoFilter('EARLY')"><span>🔵 EARLY</span><span class="cnt" id="cnt_EARLY">0</span></button>
  <button class="sum-badge sb-watch"  id="sf_WATCH"  onclick="setTipoFilter('WATCH')"><span>🟡 WATCH</span><span class="cnt" id="cnt_WATCH">0</span></button>
  <button class="sum-badge sb-rosso"  id="sf_ROSSO"  onclick="setTipoFilter('ROSSO')"><span>⚪ ROSSO+</span><span class="cnt" id="cnt_ROSSO">0</span></button>
  <button class="sum-badge sb-stop"   id="sf_STOP"   onclick="setTipoFilter('STOP')"><span>⛔ STOP</span><span class="cnt" id="cnt_STOP">0</span></button>
  <button class="sum-badge sb-uscita" id="sf_USCITA" onclick="setTipoFilter('USCITA')"><span>🔴 USCITA</span><span class="cnt" id="cnt_USCITA">0</span></button>
  <button class="sum-badge sb-att"    id="sf_ATT"    onclick="setTipoFilter('ATT')"><span>🟡 ATTENZIONE</span><span class="cnt" id="cnt_ATT">0</span></button>
</div>

<div class="filters-wrap">
  <span class="filters-label">CATEGORIA</span>
  <div id="catChips" style="display:flex;flex-wrap:wrap;gap:5px"></div>
</div>

<div class="search-bar">
  <input id="searchInput" type="text" placeholder="🔍  Cerca ticker o categoria...">
  <span id="resultCount" style="color:#94a3b8;font-size:11px">0 risultati</span>
  <span style="font-size:10px;color:#cbd5e1;margin-left:8px">* = valore cappato nello score</span>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th data-col="rank" onclick="sortBy('rank')">#</th>
      <th data-col="display" onclick="sortBy('display')">TICKER</th>
      <th data-col="categoria" onclick="sortBy('categoria')">CATEGORIA</th>
      <th data-col="stato" onclick="sortBy('stato')">STATO</th>
      <th data-col="pAboveKama" onclick="sortBy('pAboveKama')">P&gt;KAMA</th>
      <th data-col="er" onclick="sortBy('er')">ER</th>
      <th data-col="erOk" onclick="sortBy('erOk')">ER≥0.5</th>
      <th data-col="baffCount" onclick="sortBy('baffCount')">BAFF.</th>
      <th data-col="baf3" onclick="sortBy('baf3')">3 BAFF.</th>
      <th data-col="mmAlign" onclick="sortBy('mmAlign')">MM ALIGN</th>
      <th data-col="aoPositive" onclick="sortBy('aoPositive')">AO&gt;0</th>
      <th data-col="rsi" onclick="sortBy('rsi')">RSI</th>
      <th data-col="prezzo" onclick="sortBy('prezzo')">PREZZO</th>
      <th data-col="kama" onclick="sortBy('kama')">KAMA</th>
      <th data-col="perfSett" onclick="sortBy('perfSett')">SETT%</th>
      <th data-col="perfMese" onclick="sortBy('perfMese')">MESE%</th>
      <th data-col="score" onclick="sortBy('score')" class="sort-desc">SCORE ↓</th>
      <th data-col="entryDate" onclick="sortBy('entryDate')">DATA ING.</th>
      <th data-col="tipo" onclick="sortBy('tipo')">SEGNALE</th>
      <th data-col="uscita" onclick="sortBy('uscita')">USCITA</th>
    </tr>
  </thead>
  <tbody id="rankBody">
    <tr>
      <td colspan="20" class="loading">
        <div class="icon">⏳</div>
        <div style="font-size:14px;font-weight:600;color:#475569">Caricamento ranking...</div>
      </td>
    </tr>
  </tbody>
</table>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────
const JSON_URL = 'https://giorgiogoldoni.github.io/raptor-ranking/data/ranking.json';

// ── STATE ─────────────────────────────────────────────────
let allResults = [];
let displayResults = [];
let activeCats = new Set();
let activeTipoFilter = 'ALL';
let sortCol = 'score';
let sortDir = -1;
let searchQuery = '';

// ── LOAD JSON ─────────────────────────────────────────────
async function loadRanking() {
  try {
    const r = await fetch(JSON_URL + '?t=' + Date.now(), { signal: AbortSignal.timeout(15000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const json = await r.json();
    allResults = json.data || [];

    const meta = json.meta || {};
    document.getElementById('lastCalc').textContent = 'Aggiornato: ' + (meta.updated_it || '—');
    document.getElementById('tickerCount').textContent = (meta.total || allResults.length) + ' TICKER';

    // Salva in localStorage per il Command Center
    try {
      localStorage.setItem('raptor_ranking', JSON.stringify(allResults));
      localStorage.setItem('raptor_ranking_ts', meta.updated_it || '');
    } catch(e) {}

    applyFiltersAndSort();
    renderSummary();
    renderFilters();
    renderTable();
  } catch(e) {
    document.getElementById('rankBody').innerHTML = `
      <tr><td colspan="20" class="loading">
        <div class="icon">⚠️</div>
        <div style="font-size:14px;font-weight:600;color:#475569;margin-bottom:6px">Errore caricamento JSON</div>
        <div style="font-size:11px;color:#94a3b8">${e.message}</div>
        <button onclick="loadRanking()" style="margin-top:12px;padding:8px 16px;background:#0ea5e9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px">🔄 Riprova</button>
      </td></tr>`;
  }
}

// ── EXPORT EXCEL ──────────────────────────────────────────
function exportExcel() {
  if (!allResults.length) { alert('Nessun dato'); return; }
  const rows = displayResults.length ? displayResults : allResults;
  const data = [['#','TICKER','CATEGORIA','NOME','SEGNALE','SCORE','STATO','ER','BAFFETTI','MM ALIGN','AO>0','P>KAMA','SETT%','MESE%','P/K%','DATA ING.','USCITA','RSI']];
  rows.forEach((r, i) => {
    if (r.error && !r.prezzo) return;
    data.push([i+1, r.display||r.ticker||'', r.categoria||'', r.nome||'',
      r.tipo||'', r.score||0, r.stato||'', r.er!=null?r.er:'',
      r.baffCount!=null?r.baffCount:'', r.mmAlign?'SI':'NO',
      r.aoPositive?'SI':'NO', r.pAboveKama?'SI':'NO',
      r.perfSett!=null?r.perfSett:'', r.perfMese!=null?r.perfMese:'',
      r.pkPct!=null?r.pkPct:'', r.entryDate||'', r.uscita||'', r.rsi!=null?r.rsi:'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'RAPTOR Ranking');
  const now = new Date();
  const d = now.getDate().toString().padStart(2,'0') + '_' + (now.getMonth()+1).toString().padStart(2,'0') + '_' + now.getFullYear();
  XLSX.writeFile(wb, 'RAPTOR_Ranking_' + d + '.xlsx');
}

// ── FILTERS & SORT ────────────────────────────────────────
function applyFiltersAndSort() {
  let d = [...allResults];
  if (activeTipoFilter === 'STOP')   d = d.filter(r => r.uscita && r.uscita.includes('STOP'));
  else if (activeTipoFilter === 'USCITA') d = d.filter(r => r.uscita && r.uscita.includes('USCITA'));
  else if (activeTipoFilter === 'ATT')    d = d.filter(r => r.uscita && r.uscita.includes('ATTENZIONE'));
  else if (activeTipoFilter !== 'ALL') {
    const map = {'LONG':'🟢 LONG','EARLY':'🔵 EARLY','WATCH':'🟡 WATCH','ROSSO':'⚪ ROSSO+'};
    d = d.filter(r => r.tipo === (map[activeTipoFilter] || activeTipoFilter));
  }
  if (activeCats.size > 0) d = d.filter(r => activeCats.has(r.categoria));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    d = d.filter(r => (r.display||'').toLowerCase().includes(q) || (r.ticker||'').toLowerCase().includes(q) || (r.categoria||'').toLowerCase().includes(q) || (r.nome||'').toLowerCase().includes(q));
  }
  function dateToNum(s) {
    if (!s || s === '—' || s === '') return 0;
    const p = String(s).split('/');
    if (p.length === 3) return parseInt(p[2] + p[1].padStart(2,'0') + p[0].padStart(2,'0'));
    return 0;
  }
  d.sort((a, b) => {
    if (sortCol === 'entryDate') return (dateToNum(a.entryDate) - dateToNum(b.entryDate)) * sortDir;
    const av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
    if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });
  d.forEach((r, i) => { r.rank = i + 1; });
  displayResults = d;
  document.getElementById('resultCount').textContent = d.length + ' risultati';
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = col === 'score' ? -1 : 1; }
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.dataset.col === col) th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
  });
  applyFiltersAndSort();
  renderTable();
}

// ── RENDER ────────────────────────────────────────────────
function ck(v) { return v ? '<span class="ok">✓</span>' : '<span class="no">✗</span>'; }
function fp(v, cap) {
  const d = v != null ? Number(v) : 0;
  const cls = d > 0 ? 'perf-pos' : 'perf-neg';
  const capped = cap && Math.abs(d) > cap ? '*' : '';
  return `<span class="${cls}">${d > 0 ? '+' : ''}${d.toFixed(2)}%${capped}</span>`;
}
function statoHtml(s) {
  if (s === 'VERDE') return '<span class="stato-verde">🟢 VERDE</span>';
  if (s === 'ROSSO') return '<span class="stato-rosso">🔴 ROSSO</span>';
  if (s === 'GRIGIO') return '<span class="stato-grigio">⚫ GRIGIO</span>';
  return `<span style="color:#cbd5e1">${s||'—'}</span>`;
}
function uscitaHtml(u) {
  if (!u) return '<span style="color:#cbd5e1;font-size:11px">—</span>';
  if (u.includes('STOP'))       return '<span style="background:#fee2e2;color:#dc2626;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700">⛔ STOP</span>';
  if (u.includes('USCITA'))     return '<span style="background:#fef3c7;color:#d97706;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700">🔴 USCITA</span>';
  if (u.includes('ATTENZIONE')) return '<span style="background:#fffbeb;color:#92400e;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700">🟡 ATT.</span>';
  return '<span style="color:#cbd5e1;font-size:11px">—</span>';
}
function tipoHtml(t) {
  if (!t) return '<span class="tipo-none">—</span>';
  const cls = {'🟢 LONG':'tipo-long','🔵 EARLY':'tipo-early','🟡 WATCH':'tipo-watch','⚪ ROSSO+':'tipo-rosso'};
  return `<span class="${cls[t]||'tipo-none'}">${t}</span>`;
}
function scoreHtml(s, max) {
  const cls = s > 100 ? 'score-hi' : s > 60 ? 'score-mid' : 'score-lo';
  const w = max > 0 ? Math.round(s / max * 50) : 0;
  return `<div class="score-bar-cell"><span class="score-cell ${cls}">${s}</span><span class="score-mini-bar"><span class="score-mini-fill" style="width:${w}px"></span></span></div>`;
}

function renderTable() {
  const tbody = document.getElementById('rankBody');
  if (!displayResults.length) {
    tbody.innerHTML = '<tr><td colspan="20" style="text-align:center;padding:40px;color:#94a3b8">' +
      (allResults.length ? 'Nessun ticker corrisponde ai filtri' : 'Caricamento...') + '</td></tr>';
    return;
  }
  const max = Math.max(...displayResults.map(r => r.score || 0), 1);
  tbody.innerHTML = displayResults.map((r, i) => {
    if (r.error && !r.prezzo) return `<tr class="err-row"><td class="rank-n">${r.rank||i+1}</td><td class="tk-cell">${r.display}</td><td class="cat-cell">${r.categoria}</td><td colspan="15" style="color:#cbd5e1;font-size:10px">${r.error}</td></tr>`;
    const erCls = (r.er || 0) >= 0.5 ? 'er-hi' : 'er-lo';
    const safeT = encodeURIComponent(r.display || r.ticker || '');
    return `<tr class="tk-row" data-ticker="${safeT}">
      <td class="rank-n">${r.rank||i+1}</td>
      <td class="tk-cell" title="${r.nome||''}">${r.display}</td>
      <td class="cat-cell" title="${r.categoria}">${r.categoria}</td>
      <td>${statoHtml(r.stato)}</td>
      <td>${ck(r.pAboveKama)}</td>
      <td class="mono ${erCls}">${r.er != null ? r.er.toFixed(3) : '—'}</td>
      <td>${ck(r.erOk)}</td>
      <td class="mono">${r.baffCount||0}</td>
      <td>${ck(r.baf3)}</td>
      <td>${ck(r.mmAlign)}</td>
      <td>${ck(r.aoPositive)}</td>
      <td class="mono">${r.rsi != null ? Number(r.rsi).toFixed(1) : '—'}</td>
      <td class="mono">${r.prezzo != null ? Number(r.prezzo).toFixed(3) : '—'}</td>
      <td class="mono">${r.kama != null ? Number(r.kama).toFixed(3) : '—'}</td>
      <td>${fp(r.perfSett, 5)}</td>
      <td>${fp(r.perfMese, 10)}</td>
      <td>${scoreHtml(r.score, max)}</td>
      <td style="color:#64748b;font-size:10px;font-family:JetBrains Mono,monospace">${r.entryDate||'—'}</td>
      <td>${tipoHtml(r.tipo)}</td>
      <td>${uscitaHtml(r.uscita)}</td>
    </tr>`;
  }).join('');
}

function renderSummary() {
  const counts = {'ALL':allResults.length,'🟢 LONG':0,'🔵 EARLY':0,'🟡 WATCH':0,'⚪ ROSSO+':0};
  const uStop = allResults.filter(r => r.uscita === '⛔ STOP').length;
  const uUscita = allResults.filter(r => r.uscita === '🔴 USCITA').length;
  const uAtt = allResults.filter(r => r.uscita === '🟡 ATTENZIONE').length;
  allResults.forEach(r => { if (r.tipo && counts[r.tipo] !== undefined) counts[r.tipo]++; });
  document.getElementById('cnt_ALL').textContent = counts['ALL'];
  document.getElementById('cnt_LONG').textContent = counts['🟢 LONG'];
  document.getElementById('cnt_EARLY').textContent = counts['🔵 EARLY'];
  document.getElementById('cnt_WATCH').textContent = counts['🟡 WATCH'];
  document.getElementById('cnt_ROSSO').textContent = counts['⚪ ROSSO+'];
  document.getElementById('cnt_STOP').textContent = uStop;
  document.getElementById('cnt_USCITA').textContent = uUscita;
  document.getElementById('cnt_ATT').textContent = uAtt;
}

function renderFilters() {
  const wrap = document.getElementById('catChips');
  const cats = [...new Set(allResults.map(t => t.categoria))].sort();
  wrap.innerHTML = '';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'chip chip-reset';
  resetBtn.textContent = '✕ Reset';
  resetBtn.onclick = resetCats;
  wrap.appendChild(resetBtn);
  cats.forEach(c => {
    const cnt = allResults.filter(r => r.categoria === c).length;
    const b = document.createElement('button');
    b.className = 'chip' + (activeCats.has(c) ? ' act' : '');
    b.title = c;
    b.textContent = c + ' (' + cnt + ')';
    b.dataset.cat = c;
    b.onclick = () => toggleCat(c);
    wrap.appendChild(b);
  });
}

function toggleCat(c) {
  if (activeCats.has(c)) activeCats.delete(c); else activeCats.add(c);
  renderFilters();
  applyFiltersAndSort();
  renderTable();
}
function resetCats() { activeCats.clear(); renderFilters(); applyFiltersAndSort(); renderTable(); }

const TIPO_MAP = {'ALL':'ALL','LONG':'🟢 LONG','EARLY':'🔵 EARLY','WATCH':'🟡 WATCH','ROSSO':'⚪ ROSSO+','STOP':'⛔ STOP','USCITA':'🔴 USCITA','ATT':'🟡 ATTENZIONE'};
function setTipoFilter(key) {
  activeTipoFilter = key;
  ['ALL','LONG','EARLY','WATCH','ROSSO','STOP','USCITA','ATT'].forEach(k => {
    const b = document.getElementById('sf_' + k);
    if (b) b.classList.toggle('act', k === activeTipoFilter);
  });
  applyFiltersAndSort();
  renderSummary();
  renderTable();
}

document.getElementById('rankBody').addEventListener('click', function(e) {
  const row = e.target.closest('tr.tk-row');
  if (row) window.open('RAPTOR_Advanced.html?ticker=' + row.dataset.ticker, '_blank');
});

document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.trim();
  applyFiltersAndSort();
  renderTable();
});

// Auto-refresh ogni 30 minuti
loadRanking();
setInterval(loadRanking, 30 * 60 * 1000);
</script>
</body>
</html>
